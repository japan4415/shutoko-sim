name: Rust and WASM
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bash scripts/build-wasm.sh
      - run: node scripts/test-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: routing-wasm
          path: dist/wasm/
