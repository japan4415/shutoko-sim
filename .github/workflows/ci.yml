name: Rust and WASM
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --release -p shutoko-routing-core --test real_graph_contract --locked -- --ignored
      - run: cargo test --release -p shutoko-graph-builder --test release_contract --locked -- --ignored
      - run: cargo test --release -p shutoko-graph-builder --test route_relation_coverage --locked -- --ignored
      - name: Verify fixture regeneration determinism
        run: |
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "${snapshot_dir}"' EXIT
          bash scripts/generate-fixtures.sh "${snapshot_dir}"
          bash scripts/generate-fixtures.sh
          diff --no-dereference -r "${snapshot_dir}" fixtures/generated
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after fixture regeneration:"
            git status --porcelain
            exit 1
          fi
      - name: Verify the C2 label audit and the upstream changeset package
        run: |
          python3 scripts/audit-c2-carriageway-labels.py --json /tmp/audit-c2.json
          python3 scripts/derive-osm-relation-repairs.py --check
          package_dir="$(mktemp -d)"
          python3 scripts/build-osm-changeset.py --out-dir "${package_dir}"
          rm -rf "${package_dir}"
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bash scripts/build-wasm.sh
      - run: node scripts/test-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: routing-wasm
          path: dist/wasm/

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm run typecheck
        working-directory: workers
      - run: npm test
        working-directory: workers

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # web の typecheck / 単体テストは dist/wasm（git 管理外）を import するため、
      # 依存インストールと検査より前に WASM 成果物をビルドしておく必要がある。
      - name: Install Rust toolchain and wasm-bindgen CLI
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build WASM artifacts
        run: bash scripts/build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            workers/package-lock.json
      - name: Install deps (web + workers)
        run: |
          npm ci
          npm --prefix ../workers ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # E2E の dev サーバは cf dev（新設定系 cloudflare.config.ts / wrangler.config.ts、
      # Issue #98）。seed:local（wrangler --local）が書く .wrangler/state を cf dev が読むため
      # seed は wrangler のまま。cf（1.0.0-beta.14）と wrangler（4.149.0）は workers の
      # npm ci で入る。本番 R2 への公開投入（seed --remote）は認証と本番書き込みが
      # 必要なため CI では実行しない。
      - name: Seed local R2 (Miniflare local state)
        run: npm run seed:local
        working-directory: workers
      - name: E2E (vite build → cf dev 8787 → Playwright)
        run: npm run e2e
        working-directory: web
