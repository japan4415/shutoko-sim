name: Rust and WASM
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --release -p shutoko-routing-core --test real_graph_contract --locked -- --ignored
      - name: Verify fixture regeneration determinism
        run: |
          bash scripts/generate-fixtures.sh
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after fixture regeneration:"
            git status --porcelain
            exit 1
          fi
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bash scripts/build-wasm.sh
      - run: node scripts/test-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: routing-wasm
          path: dist/wasm/

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm run typecheck
        working-directory: workers
      - run: npm test
        working-directory: workers

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            workers/package-lock.json
      - name: Install deps (web + workers)
        run: |
          npm ci
          npm --prefix ../workers ci
        working-directory: web
      - name: Install Rust toolchain and wasm-bindgen CLI
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build WASM artifacts
        run: bash scripts/build-wasm.sh
      - name: Seed local R2 (Miniflare preview bucket)
        run: npm run seed:local
        working-directory: workers
      - name: E2E (vite build → wrangler dev 8787 → Playwright)
        run: npm run e2e
        working-directory: web
