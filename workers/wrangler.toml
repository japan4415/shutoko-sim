name = "shutoko-sim-workers"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[vars]
ALLOWED_RELEASES = "c1-real-v1"

[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
# ローカル（wrangler dev / seed:local の --local）と同じ状態ディレクトリを使うため
# preview も本番と同じバケット名にする（remote デプロイ時のみ shutoko-artifacts を使用）。
bucket_name = "shutoko-artifacts"
preview_bucket_name = "shutoko-artifacts"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# 静的 SPA と Worker API を同一オリジンで配信する（full-stack 構成）。
# assets に一致が無いパス（/releases、/api）は通常の Worker fetch にフォールバックする。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
