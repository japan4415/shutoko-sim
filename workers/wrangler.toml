name = "shutoko-sim-workers"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[vars]
# all-real-v4 以前を allowlist に残すのは rollback 用。Web の既定（web/src/worker/
# artifact-hashes.ts の DEFAULT_RELEASE_ID）を 1 行戻すだけで配信を戻せるようにする。
ALLOWED_RELEASES = "c1-real-v1,c1-real-v2,all-real-v1,all-real-v2,all-real-v3,all-real-v4,all-real-v5"

[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
# この wrangler.toml は Workers Builds の deploy command（`npx wrangler deploy`、旧設定）が
# 読み続ける。cf dev / cf deploy は新設定系の cloudflare.config.ts / wrangler.config.ts を
# 読む。新設定系に preview_bucket_name は無く、ローカル（cf dev の R2 シミュレーション）は
# bucket_name を名前空間として使い、seed-local-r2.mjs も同じ名前へ書く。
bucket_name = "shutoko-artifacts"
preview_bucket_name = "shutoko-artifacts-preview"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# 静的 SPA と Worker API を同一オリジンで配信する（full-stack 構成）。
# assets に一致が無いパス（/releases、/api）は通常の Worker fetch にフォールバックする。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
